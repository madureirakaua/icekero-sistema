<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel da Loja — Ice Kero</title>
  <meta name="theme-color" content="#23142a">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="https://cdn.neemo.com.br/uploads/settings_webdelivery/logo/16595/01logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #f6f2f7; }
    .topbar { background: var(--ink); color: #fff; position: sticky; top: 0; z-index: 10; }
    .topbar .container { display: flex; align-items: center; gap: 18px; height: 68px; }
    .topbar .tag-sys { font-weight: 800; font-size: 13px; background: rgba(255,255,255,.12); padding: 5px 12px; border-radius: 99px; }
    .topbar .right { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .topbar select, .topbar .btn { font-size: 14px; padding: 9px 14px; }
    .topbar select { font: inherit; font-weight: 800; border-radius: 99px; border: 0; padding: 9px 14px; }
    .topbar a.link { color: #fff; font-weight: 700; font-size: 14px; opacity: .8; }
    .wrap { width: min(1400px, 100% - 32px); margin: 24px auto 60px; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .kpi { background: #fff; border-radius: 20px; padding: 18px 20px; border: 1px solid var(--line); }
    .kpi small { color: var(--muted); font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .4px; }
    .kpi strong { display: block; font-family: var(--font-title); font-size: 30px; margin-top: 4px; }
    .kpi span { font-size: 13px; color: var(--muted); }
    .board { display: grid; grid-template-columns: repeat(4, minmax(260px, 1fr)); gap: 16px; overflow-x: auto; padding-bottom: 8px; }
    .col { background: #ece4ee; border-radius: 22px; padding: 14px; min-height: 420px; }
    .col h3 { font-size: 17px; display: flex; align-items: center; gap: 8px; margin: 4px 6px 14px; }
    .col h3 .n { margin-left: auto; background: #fff; border-radius: 99px; font-size: 13px; padding: 2px 10px; font-family: var(--font-body); font-weight: 800; }
    .col[data-s="novo"] h3 { color: var(--pink-dark); }
    .ocard { background: #fff; border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 2px 0 rgba(0,0,0,.04); border-left: 5px solid var(--line); }
    .col[data-s="novo"] .ocard { border-left-color: var(--pink); }
    .col[data-s="preparo"] .ocard { border-left-color: #f4b400; }
    .col[data-s="rota"] .ocard { border-left-color: var(--teal); }
    .col[data-s="entregue"] .ocard { border-left-color: #8bc34a; opacity: .8; }
    .ocard.fresh { animation: flash 1.2s 3; }
    @keyframes flash { 50% { box-shadow: 0 0 0 4px rgba(232,25,122,.35); } }
    .ohead { display: flex; justify-content: space-between; align-items: baseline; }
    .ohead strong { font-family: var(--font-title); font-size: 19px; }
    .ohead span { font-size: 12px; color: var(--muted); font-weight: 700; }
    .ocli { font-weight: 800; margin-top: 4px; }
    .ometa { font-size: 13px; color: var(--muted); }
    .oitems { margin: 10px 0; padding: 10px 0; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); font-size: 14px; }
    .oitems div { margin-bottom: 4px; }
    .oitems small { display: block; color: var(--muted); padding-left: 22px; }
    .ofoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .ofoot .total { font-family: var(--font-title); font-weight: 700; font-size: 18px; }
    .ofoot .btn { padding: 8px 14px; font-size: 13px; }
    .pill { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: var(--teal-soft); color: var(--teal-dark); margin-right: 4px; }
    .pill.pink { background: var(--pink-soft); color: var(--pink-dark); }
    .ocard.is-cancel { border-left-color: #d64545 !important; opacity: .75; }
    .ocard.is-cancel .total { text-decoration: line-through; color: var(--muted); }
    .cancel-box { background: #fdecec; color: #b42323; font-weight: 800; font-size: 13px; padding: 8px 10px; border-radius: 10px; margin-bottom: 10px; }
    .ofoot { flex-wrap: wrap; row-gap: 10px; }
    .oacts { display: flex; gap: 6px; margin-left: auto; }
    .ofoot .btn { white-space: nowrap; }
    .btn-danger { background: #d64545; color: #fff; }
    .btn-danger:hover { background: #b42323; }
    .btn-danger-ghost { background: #fff; color: #b42323; border: 2px solid #f3c9c9; }
    .btn-danger-ghost:hover { background: #fdecec; }
    .link-cancel { border: 0; background: none; color: #b42323; font-weight: 700; font-size: 12px; padding: 8px 0 0; text-decoration: underline; }
    .col-empty { text-align: center; color: #a597a9; font-weight: 700; font-size: 14px; padding: 30px 10px; }
    body.locked .topbar, body.locked .wrap { display: none; }
    .gate { display: none; min-height: 100vh; place-items: center; padding: 24px 16px;
      background: radial-gradient(circle at 80% 10%, var(--pink-soft), transparent 50%), radial-gradient(circle at 10% 90%, var(--teal-soft), transparent 50%), #f6f2f7; }
    body.locked .gate { display: grid; }
    .gate-card { width: min(400px, 100%); background: #fff; border-radius: 28px; padding: 36px 30px; box-shadow: var(--shadow); text-align: center; }
    .gate-card .brand { margin-bottom: 18px; }
    .gate-card h1 { font-size: 26px; margin-bottom: 6px; }
    .gate-card p { color: var(--muted); margin: 0 0 22px; font-size: 15px; }
    .gate-card label.field { text-align: left; }
    .gate-err { color: var(--pink-dark); font-weight: 800; font-size: 14px; min-height: 20px; margin: -4px 0 10px; }
    .gate-card.shake { animation: shake .35s; }
    @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .gate-back { display: inline-block; margin-top: 18px; color: var(--muted); font-weight: 700; font-size: 14px; }
    @media (max-width: 900px) { .kpis { grid-template-columns: 1fr 1fr; } .board { grid-template-columns: repeat(4, 280px); } .topbar .container { height: auto; padding: 12px 0; flex-wrap: wrap; } }
  </style>
</head>
<body class="locked">
  <div class="gate">
    <form class="gate-card" id="gateForm">
      <span class="brand"><span class="ice">ICE</span><span class="kero">KERO</span></span>
      <h1>Área da loja</h1>
      <p>Acesso restrito à equipe da Ice Kero.</p>
      <label class="field">E-mail <input type="email" id="gateEmail" autocomplete="username" required></label>
      <label class="field">Senha <input type="password" id="gatePass" autocomplete="current-password" required></label>
      <div class="gate-err" id="gateErr"></div>
      <button class="btn btn-pink btn-block" type="submit" id="gateBtn">Entrar</button>
      <a class="gate-back" href="index.html">← Voltar para o site</a>
    </form>
  </div>

  <header class="topbar">
    <div class="container" style="width:min(1400px,100% - 32px)">
      <a href="index.html" class="brand" style="color:#fff"><span class="ice">ICE</span><span class="kero">KERO</span></a>
      <span class="tag-sys">Painel da loja</span>
      <span class="tag-sys" id="liveTag" title="Conexão em tempo real">● Ao vivo</span>
      <div class="right">
        <select id="storeSel" aria-label="Loja"></select>
        <select id="openSel" aria-label="Status da loja">
          <option value="auto">⏱ Horário automático</option>
          <option value="true">🟢 Loja aberta</option>
          <option value="false">🔴 Loja fechada</option>
        </select>
        <span class="link" id="staffName" style="opacity:.7"></span>
        <a class="link" href="index.html" target="_blank">Abrir site ↗</a>
        <a class="link" href="#" id="logoutBtn">Sair</a>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="kpis">
      <div class="kpi"><small>Pedidos hoje</small><strong id="kPedidos">0</strong><span id="kAbertos">0 em andamento</span></div>
      <div class="kpi"><small>Faturamento hoje</small><strong id="kFat">R$ 0,00</strong><span id="kEntrega">—</span></div>
      <div class="kpi"><small>Ticket médio</small><strong id="kTicket">R$ 0,00</strong><span>por pedido</span></div>
      <div class="kpi"><small>Mais vendido</small><strong id="kTop" style="font-size:20px;line-height:1.2;margin-top:10px">—</strong><span id="kTopQ"></span></div>
    </div>
    <div class="board" id="board"></div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="overlay" id="overlay"></div>
  <div class="modal" id="cancelModal" role="dialog" aria-modal="true"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script>
// Painel da loja. O acesso é validado no servidor: só contas marcadas como
// equipe (profiles.is_staff) conseguem ver todos os pedidos e alterá-los.
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const PAG = { pix: "Pix", cartao: "Cartão", dinheiro: "Dinheiro" };
  const NEXT = { novo: ["preparo", "Aceitar e preparar"], preparo: ["rota", "Saiu p/ entrega", "Pronto p/ retirada"], rota: ["entregue", "Concluir"] };
  let orders = [];
  let fresh = new Set();
  let channel = null, settingsCh = null;
  let started = false;
  let stores = [], myStore = null, sel = "all";
  const lojaNome = (id) => stores.find((s) => s.id === id)?.nome || id;
  const visivel = (o) => sel === "all" || o.storeId === sel;

  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600); }
  const ago = (t) => {
    const m = Math.floor((Date.now() - t) / 60000);
    if (m < 1) return "agora";
    if (m < 60) return `há ${m} min`;
    return new Date(t).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  };
  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, .18].forEach((d, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = i ? 1046 : 784; o.type = "sine";
        g.gain.setValueAtTime(.0001, ctx.currentTime + d);
        g.gain.exponentialRampToValueAtTime(.3, ctx.currentTime + d + .02);
        g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + d + .25);
        o.connect(g).connect(ctx.destination); o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + .3);
      });
    } catch {}
  }

  // ---------- acesso ----------
  async function checkAccess() {
    const user = await Api.user();
    if (!user) return lock();
    let prof = null;
    try { prof = await Api.profile(); } catch {}
    if (!prof || !prof.is_staff) {
      await Api.signOut();
      lock("Esta conta não tem acesso ao painel da loja.");
      return;
    }
    $("#staffName").textContent = prof.nome || user.email;
    myStore = prof.store_id || null;
    sel = myStore || "all";
    document.body.classList.remove("locked");
    if (!started) { started = true; start(); }
  }
  function lock(msg) {
    document.body.classList.add("locked");
    $("#gateErr").textContent = msg || "";
    if (channel) { sb.removeChannel(channel); channel = null; }
    if (settingsCh) { sb.removeChannel(settingsCh); settingsCh = null; }
    started = false; orders = [];
  }
  $("#gateForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("#gateBtn"); btn.disabled = true; btn.textContent = "Entrando…";
    $("#gateErr").textContent = "";
    try {
      await Api.signIn($("#gateEmail").value.trim(), $("#gatePass").value);
      $("#gatePass").value = "";
      await checkAccess();
    } catch (ex) {
      $("#gateErr").textContent = errMsg(ex);
      const card = $("#gateForm"); card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    } finally { btn.disabled = false; btn.textContent = "Entrar"; }
  });
  $("#logoutBtn").addEventListener("click", async (e) => { e.preventDefault(); await Api.signOut(); lock(); });

  // ---------- dados ----------
  async function start() {
    try { orders = await Api.boardOrders(); } catch (ex) { toast(errMsg(ex)); }
    render();
    channel = Api.watchOrders("painel", null, (ev, o) => {
      if (!o) return;
      const i = orders.findIndex((x) => x.id === o.id);
      if (ev === "INSERT" && i < 0) {
        orders.push(o); fresh.add(o.id);
        if (visivel(o)) { beep(); toast(`🔔 Novo pedido ${o.code} de ${o.cliente.nome} (${lojaNome(o.storeId)})!`); }
        document.title = `🔔 Novo pedido — Ice Kero`;
        setTimeout(() => (document.title = "Painel da Loja — Ice Kero"), 6000);
      } else if (i >= 0) orders[i] = o;
      else orders.push(o);
      render();
    });
    try { stores = await Api.stores(); } catch {}
    renderStoreSel(); syncOpenSel(); render();
    settingsCh = Api.watchStores((row) => {
      const i = stores.findIndex((s) => s.id === row.id);
      if (i >= 0) stores[i] = { ...stores[i], ...row };
      syncOpenSel(); renderStoreSel();
    });
  }

  // ---------- lojas ----------
  function renderStoreSel() {
    const opts = (myStore ? stores.filter((s) => s.id === myStore) : stores)
      .map((s) => `<option value="${s.id}">🏪 ${esc(s.nome)} ${Api.isOpen(s) ? "• aberta" : "• fechada"}</option>`).join("");
    $("#storeSel").innerHTML = (myStore ? "" : `<option value="all">🏪 Todas as lojas</option>`) + opts;
    $("#storeSel").value = sel;
    $("#storeSel").disabled = !!myStore;
  }
  function syncOpenSel() {
    const s = stores.find((x) => x.id === sel);
    const el = $("#openSel");
    el.disabled = !s;
    el.title = s ? "" : "Escolha uma loja para abrir ou fechar";
    if (s) el.value = s.aberta === null ? "auto" : String(s.aberta);
  }
  $("#storeSel").addEventListener("change", (e) => { sel = e.target.value; syncOpenSel(); render(); });

  function render() {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    const todayAll = orders.filter((o) => visivel(o) && o.createdAt >= start.getTime());
    const canc = todayAll.filter((o) => o.status === "cancelado").length;
    const today = todayAll.filter((o) => o.status !== "cancelado"); // cancelados não entram nos números
    const fat = today.reduce((s, o) => s + o.total, 0);
    $("#kPedidos").textContent = today.length;
    $("#kAbertos").textContent = `${orders.filter((o) => visivel(o) && ["novo", "preparo", "rota"].includes(o.status)).length} em andamento${canc ? ` • ${canc} ${canc === 1 ? "cancelado" : "cancelados"}` : ""}`;
    $("#kFat").textContent = brl(fat);
    const ent = today.filter((o) => o.tipo === "entrega").length;
    $("#kEntrega").textContent = today.length ? `${ent} entregas • ${today.length - ent} retiradas` : "—";
    $("#kTicket").textContent = brl(today.length ? fat / today.length : 0);
    const cnt = {};
    today.forEach((o) => o.itens.forEach((i) => (cnt[i.nome] = (cnt[i.nome] || 0) + i.qtd)));
    const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
    $("#kTop").textContent = top ? top[0] : "—";
    $("#kTopQ").textContent = top ? `${top[1]} vendidos hoje` : "";

    $("#board").innerHTML = Store.STATUS.map((s) => {
      // Em andamento: o mais antigo no topo (fila por ordem de chegada).
      // Finalizados: o que terminou por último aparece primeiro.
      const list = s.id === "entregue"
        ? orders.filter((o) => visivel(o) && (o.status === "entregue" || o.status === "cancelado") && o.createdAt >= start.getTime())
            .sort((a, b) => (b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt))
        : orders.filter((o) => visivel(o) && o.status === s.id).sort((a, b) => a.createdAt - b.createdAt);
      return `<div class="col" data-s="${s.id}">
        <h3>${s.emoji} ${s.id === "rota" ? "Entrega / Retirada" : s.id === "entregue" ? "Finalizados hoje" : s.nome}<span class="n">${list.length}</span></h3>
        ${list.map(cardHtml).join("") || `<div class="col-empty">Nenhum pedido</div>`}
      </div>`;
    }).join("");
  }

  function cardHtml(o) {
    const nx = NEXT[o.status];
    const label = nx ? (o.tipo === "retirada" && nx[2] ? nx[2] : nx[1]) : null;
    return `<div class="ocard ${fresh.has(o.id) ? "fresh" : ""} ${o.status === "cancelado" ? "is-cancel" : ""}">
      <div class="ohead"><strong>${esc(o.code)}</strong><span>${ago(o.createdAt)}</span></div>
      <div class="ocli">${esc(o.cliente.nome)} <span class="ometa">• ${esc(o.cliente.tel)}</span></div>
      <div class="ometa" style="margin-top:4px">
        ${sel === "all" ? `<span class="pill" style="background:#ece4ee;color:var(--ink)">🏪 ${esc(lojaNome(o.storeId))}</span>` : ""}
        <span class="pill ${o.tipo === "entrega" ? "pink" : ""}">${o.tipo === "entrega" ? "🛵 Entrega" : "🏪 Retirada"}</span>
        <span class="pill">${PAG[o.pagamento]}${o.troco ? " • troco p/ R$" + esc(o.troco) : ""}</span>
      </div>
      ${o.endereco ? `<div class="ometa" style="margin-top:6px">📍 ${esc(o.endereco)}${o.distancia != null ? ` • ${Geo.km(o.distancia)}` : ""}</div>` : ""}
      <div class="oitems">${o.itens.map((i) => `<div><b>${i.qtd}×</b> ${esc(i.nome)}${i.extras?.length ? `<small>+ ${i.extras.map(esc).join(", ")}</small>` : ""}${i.obs ? `<small>“${esc(i.obs)}”</small>` : ""}</div>`).join("")}</div>
      ${o.status === "cancelado" ? `<div class="cancel-box">❌ ${o.cancelTipo === "recusado" ? "Recusado" : "Cancelado"}${o.cancelMotivo ? ` — ${esc(o.cancelMotivo)}` : ""}</div>` : ""}
      <div class="ofoot"><span class="total">${brl(o.total)}${o.desc ? ` <span class="pill">⭐ −${brl(o.desc)}</span>` : ""}</span>
        <span class="oacts">
          ${o.status === "novo" ? `<button class="btn btn-danger-ghost" data-cancel="${o.id}">Recusar</button>` : ""}
          ${label ? `<button class="btn ${o.status === "novo" ? "btn-pink" : "btn-teal"}" data-adv="${o.id}">${label}</button>` : ""}
        </span></div>
      ${o.status === "preparo" || o.status === "rota" ? `<button class="link-cancel" data-cancel="${o.id}">Cancelar pedido</button>` : ""}
    </div>`;
  }

  function replace(o) { const i = orders.findIndex((x) => x.id === o.id); if (i >= 0) orders[i] = o; }

  // ---------- recusar / cancelar ----------
  const MOTIVOS = {
    recusar: ["Produto em falta", "Fora da área de entrega", "Loja muito cheia", "Loja fechando", "Endereço incompleto"],
    cancelar: ["Cliente pediu para cancelar", "Produto acabou", "Problema na entrega", "Cliente não atende", "Pedido duplicado"],
  };
  const overlay = $("#overlay"), cmodal = $("#cancelModal");
  function closeCancel() { overlay.classList.remove("open"); cmodal.classList.remove("open"); }
  function openCancel(id) {
    const o = orders.find((x) => x.id === id); if (!o) return;
    const recusar = o.status === "novo";
    const st = { motivo: "" };
    cmodal.innerHTML = ""; // não reaproveita o recado de um cancelamento anterior
    const draw = () => {
      const outro = $("#cOutro")?.value || "";
      cmodal.innerHTML = `
        <div class="modal-body">
          <h3>${recusar ? "Recusar" : "Cancelar"} pedido ${esc(o.code)}</h3>
          <p>${esc(o.cliente.nome)} • ${brl(o.total)}. ${recusar ? "O cliente vê na hora que o pedido foi recusado." : "O pedido já estava em andamento. O cliente é avisado na hora."}${o.pontosUsados ? " Os pontos usados voltam para o cliente." : ""}</p>
          <span class="form-label">Motivo</span>
          <div class="chips" style="margin-bottom:14px">${MOTIVOS[recusar ? "recusar" : "cancelar"].map((m) =>
            `<button class="chip ${st.motivo === m ? "active" : ""}" data-motivo="${esc(m)}">${esc(m)}</button>`).join("")}</div>
          <label class="field">Outro motivo / recado ao cliente <input id="cOutro" maxlength="140" placeholder="Opcional"></label>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" data-cclose>Voltar</button>
          <button class="btn btn-danger" id="cConfirm">${recusar ? "Recusar pedido" : "Cancelar pedido"}</button>
        </div>`;
      $("#cOutro").value = outro;
    };
    draw();
    cmodal.onclick = async (e) => {
      const m = e.target.closest("[data-motivo]");
      if (m) { st.motivo = st.motivo === m.dataset.motivo ? "" : m.dataset.motivo; draw(); return; }
      if (e.target.closest("[data-cclose]")) { closeCancel(); return; }
      const btn = e.target.closest("#cConfirm");
      if (btn) {
        const motivo = [st.motivo, $("#cOutro").value.trim()].filter(Boolean).join(" — ");
        if (!motivo) { toast("Escolha ou escreva um motivo"); return; }
        btn.disabled = true;
        try {
          const upd = await Api.cancel(o.id, motivo);
          replace(upd); fresh.delete(o.id); closeCancel(); render();
          toast(`Pedido ${o.code} ${upd.cancelTipo}`);
        } catch (ex) { toast(errMsg(ex)); btn.disabled = false; }
      }
    };
    overlay.classList.add("open"); cmodal.classList.add("open");
  }
  overlay.addEventListener("click", closeCancel);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeCancel(); });

  $("#board").addEventListener("click", async (e) => {
    const c = e.target.closest("[data-cancel]");
    if (c) { openCancel(c.dataset.cancel); return; }
    const b = e.target.closest("[data-adv]"); if (!b) return;
    b.disabled = true;
    try { const upd = await Api.advance(b.dataset.adv); replace(upd); fresh.delete(upd.id); render(); }
    catch (ex) { toast(errMsg(ex)); b.disabled = false; }
  });

  $("#openSel").addEventListener("change", async (e) => {
    const v = e.target.value;
    if (sel === "all") return;
    try {
      await Api.setOpen(sel, v === "auto" ? null : v === "true");
      const s = stores.find((x) => x.id === sel); if (s) s.aberta = v === "auto" ? null : v === "true";
      renderStoreSel();
      toast(v === "false" ? `${lojaNome(sel)} fechada — os pedidos vão para outra unidade` : `Status da ${lojaNome(sel)} atualizado no site`);
    } catch (ex) { toast(errMsg(ex)); }
  });

  setInterval(() => { if (started) render(); }, 30000);
  checkAccess();
})();
</script>
</body>
</html>
